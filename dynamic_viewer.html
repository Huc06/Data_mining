<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Dynamic TikTok Data Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(238, 90, 36, 0.3);
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
            margin-top: 8px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }
        
        .error {
            background: #ffebee;
            border: 1px solid #ffcdd2;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        
        .video-card {
            border: 2px solid #e1e8ed;
            border-radius: 15px;
            overflow: hidden;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        
        .video-header {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: white;
            padding: 15px 20px;
            font-weight: bold;
        }
        
        .video-content {
            padding: 20px;
        }
        
        .video-info {
            margin-bottom: 10px;
        }
        
        .video-info strong {
            color: #2c3e50;
            display: inline-block;
            min-width: 80px;
        }
        
        .caption {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #4facfe;
            font-style: italic;
            max-height: 100px;
            overflow-y: auto;
        }
        
        .hashtags {
            color: #1da1f2;
            font-weight: 500;
        }
        
        .video-link {
            display: inline-block;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 25px;
            margin-top: 10px;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .video-link:hover {
            background: linear-gradient(45deg, #ee5a24, #ff6b6b);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(238, 90, 36, 0.4);
        }
        
        .file-link {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 20px;
            margin: 5px 5px 5px 0;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        
        .file-link:hover {
            background: #218838;
            transform: translateY(-1px);
        }
        
        .comments-info {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        
        .has-comments {
            color: #28a745;
            background: #d4edda;
            border-left: 4px solid #28a745;
        }
        
        .no-comments {
            color: #6c757d;
            font-style: italic;
        }
        
        .update-info {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 12px;
        }
        
        .refresh-btn {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            margin-top: 15px;
            transition: all 0.3s ease;
        }
        
        .refresh-btn:hover {
            background: linear-gradient(45deg, #3a7bd5, #00d2ff);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(58, 123, 213, 0.4);
        }
        
        .last-updated {
            font-size: 0.9em;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Dynamic TikTok Data Viewer</h1>
        
        <div id="stats" class="stats">
            <div class="loading">📊 Đang tải dữ liệu...</div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="videoGrid" class="video-grid">
            <div class="loading">🔄 Đang tải danh sách video...</div>
        </div>

        <div class="update-info">
            <h3>📊 Dynamic Data Viewer</h3>
            <p>Trang này tự động đọc dữ liệu từ <code>metadata.csv</code> và cập nhật khi bạn chạy scraper mới!</p>
            <div class="last-updated" id="lastUpdated"></div>
            
            <button class="refresh-btn" onclick="loadData()">
                🔄 Refresh Data
            </button>
        </div>
    </div>

    <script>
        let currentHashtag = '';
        
        // Parse CSV data
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            if (lines.length <= 1) return [];
            
            const headers = lines[0].split(',');
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim()) {
                    const values = lines[i].split(',');
                    const row = {};
                    headers.forEach((header, index) => {
                        row[header] = values[index] || '';
                    });
                    data.push(row);
                }
            }
            return data;
        }
        
        // Load and display data
        async function loadData() {
            try {
                // Load metadata
                const response = await fetch('tiktok_data/metadata.csv');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const csvText = await response.text();
                const videos = parseCSV(csvText);
                
                // Update stats
                updateStats(videos);
                
                // Update video grid
                updateVideoGrid(videos);
                
                // Update last updated time
                document.getElementById('lastUpdated').textContent = 
                    `Cập nhật lần cuối: ${new Date().toLocaleString('vi-VN')}`;
                    
                // Hide error
                document.getElementById('error').style.display = 'none';
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('error').innerHTML = 
                    `<strong>❌ Lỗi tải dữ liệu:</strong> ${error.message}<br>
                     <small>Hãy chắc chắn bạn đã chạy scraper ít nhất một lần và có file metadata.csv</small>`;
                document.getElementById('error').style.display = 'block';
            }
        }
        
        // Update statistics
        function updateStats(videos) {
            let totalComments = 0;
            let totalLikes = 0;
            let totalShares = 0;
            let totalViews = 0;
            
            videos.forEach(video => {
                totalComments += parseInt(video.n_comments || 0);
                totalLikes += parseInt(video.likes || 0);
                totalShares += parseInt(video.shares || 0);
                totalViews += parseInt(video.views || 0);
            });
            
            // Extract hashtag from first video URL or caption
            if (videos.length > 0) {
                const url = videos[0].url || '';
                const caption = videos[0].caption || '';
                
                // Try to extract hashtag from URL or caption
                const hashtagMatch = caption.match(/#(\w+)/);
                currentHashtag = hashtagMatch ? `#${hashtagMatch[1]}` : '#unknown';
            }
            
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <span class="stat-number">${videos.length}</span>
                    <div class="stat-label">Videos Downloaded</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number">${formatNumber(totalLikes)}</span>
                    <div class="stat-label">Total Likes</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number">${formatNumber(totalShares)}</span>
                    <div class="stat-label">Total Shares</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number">${formatNumber(totalViews)}</span>
                    <div class="stat-label">Total Views</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number">${currentHashtag}</span>
                    <div class="stat-label">Current Hashtag</div>
                </div>
            `;
        }
        
        // Format large numbers
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }
        
        // Update video grid
        function updateVideoGrid(videos) {
            if (videos.length === 0) {
                document.getElementById('videoGrid').innerHTML = 
                    '<div class="loading">📭 Chưa có dữ liệu. Hãy chạy scraper để thu thập video!</div>';
                return;
            }
            
            const videoCards = videos.map(video => {
                const userName = video.creator || extractUsername(video.url);
                const shortCaption = video.caption && video.caption.length > 100 ? 
                    video.caption.substring(0, 100) + '...' : (video.caption || 'No caption');
                
                const commentsDisplay = parseInt(video.n_comments) > 0 ? 
                    `<div class="comments-info has-comments">💬 ${video.n_comments} comments collected</div>` :
                    `<div class="comments-info no-comments">💬 No comments collected</div>`;
                
                // Metrics display
                const likes = parseInt(video.likes || 0);
                const shares = parseInt(video.shares || 0);
                const views = parseInt(video.views || 0);
                
                const metricsDisplay = `
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; text-align: center;">
                        <div style="background: #e3f2fd; padding: 8px; border-radius: 8px;">
                            <strong style="color: #1976d2;">👍 ${formatNumber(likes)}</strong>
                            <div style="font-size: 0.8em; color: #666;">Likes</div>
                        </div>
                        <div style="background: #f3e5f5; padding: 8px; border-radius: 8px;">
                            <strong style="color: #7b1fa2;">📤 ${formatNumber(shares)}</strong>
                            <div style="font-size: 0.8em; color: #666;">Shares</div>
                        </div>
                        <div style="background: #e8f5e8; padding: 8px; border-radius: 8px;">
                            <strong style="color: #388e3c;">👁️ ${formatNumber(views)}</strong>
                            <div style="font-size: 0.8em; color: #666;">Views</div>
                        </div>
                    </div>
                `;
                
                return `
                    <div class="video-card">
                        <div class="video-header">
                            🎬 ${userName}
                        </div>
                        <div class="video-content">
                            <div class="video-info">
                                <strong>ID:</strong> ${video.id}
                            </div>
                            <div class="video-info">
                                <strong>Creator:</strong> ${userName}
                            </div>
                            
                            ${metricsDisplay}
                            
                            <div class="caption">
                                <strong>Caption:</strong> ${shortCaption}
                            </div>
                            
                            ${commentsDisplay}
                            
                            <div style="margin-top: 15px;">
                                <a href="${video.video_path}" class="file-link">📹 Watch Video</a>
                                <a href="${video.caption_path}" class="file-link">📄 View Caption</a>
                                <a href="${video.comment_path}" class="file-link">💬 View Comments</a>
                            </div>
                            
                            <a href="${video.url}" target="_blank" class="video-link">
                                🔗 View on TikTok
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('videoGrid').innerHTML = videoCards;
        }
        
        // Extract username from URL
        function extractUsername(url) {
            const match = url.match(/@([^\/]+)/);
            return match ? `@${match[1]}` : 'Unknown';
        }
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
        
        // Load data on page load
        window.onload = loadData;
    </script>
</body>
</html>
